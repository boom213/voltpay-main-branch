<div class="container py-4">
  <div class="row">
    <div class="col-md-5">
      <div class="card mb-3">
        <div class="card-body">
          <h5 class="card-title">Register a Complaint</h5>
          <form [formGroup]="form" (ngSubmit)="submit()">
            <div class="mb-3">
              <label class="form-label">Type</label>
              <select class="form-select" formControlName="type">
                <option value="">Select</option>
                <option>Billing Issue</option>
                <option>Payment Failure</option>
                <option>Service Outage</option>
                <option>Other</option>
              </select>
              <div class="text-danger small" *ngIf="form.get('type')?.touched && form.get('type')?.invalid">Choose a type.</div>
            </div>
            <div class="mb-3">
              <label class="form-label">Description</label>
              <textarea class="form-control" rows="4" formControlName="description"></textarea>
              <div class="text-danger small" *ngIf="form.get('description')?.touched && form.get('description')?.invalid">Provide details.</div>
            </div>
            <button class="btn btn-primary" type="submit">Submit Complaint</button>
          </form>
        </div>
      </div>
    </div>
    <div class="col-md-7">
      <div class="card">
        <div class="card-body">
          <h5 class="card-title">Your Complaints</h5>
          <ul class="list-group list-group-flush">
            <li *ngFor="let c of complaints" class="list-group-item d-flex justify-content-between align-items-start">
              <div>
                <div class="fw-bold">{{ c.type }}</div>
                <div class="small text-muted">{{ c.description }}</div>
              </div>
              <span class="badge bg-secondary align-self-start">{{ c.status }}</span>
            </li>
            <li *ngIf="complaints.length===0" class="list-group-item text-muted">No complaints yet.</li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</div>
