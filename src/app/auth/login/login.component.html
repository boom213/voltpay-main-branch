<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">
      <div class="card shadow-sm border-0">
        <div class="card-body p-4 p-lg-5">
          <h1 class="h3 fw-bold text-center mb-4">Sign in to VoltPay</h1>

          <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input
                type="email"
                class="form-control"
                placeholder="name@example.com"
                formControlName="email"
              />
              <div
                class="text-danger small"
                *ngIf="form.get('email')?.touched && form.get('email')?.invalid"
              >
                <ng-container *ngIf="form.get('email')?.hasError('required')">Email is required.</ng-container>
                <ng-container *ngIf="form.get('email')?.hasError('email')">Please enter a valid email.</ng-container>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label">Password</label>
              <input
                type="password"
                class="form-control"
                placeholder="Your password"
                formControlName="password"
              />
              <div
                class="text-danger small"
                *ngIf="
                  form.get('password')?.touched && form.get('password')?.invalid
                "
              >
                <ng-container *ngIf="form.get('password')?.hasError('required')">Password is required.</ng-container>
                <ng-container *ngIf="form.get('password')?.hasError('minlength')">Minimum 8 characters.</ng-container>
              </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-3">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="rememberMe" formControlName="rememberMe">
                <label class="form-check-label small" for="rememberMe">
                  Remember me
                </label>
              </div>
              <a routerLink="/forgot-password" class="small">Forgot password?</a>
            </div>

            <button
              class="btn btn-primary w-100"
              [disabled]="loading"
              type="submit"
            >
              <span *ngIf="!loading">Sign in</span>
              <span
                *ngIf="loading"
                class="spinner-border spinner-border-sm"
              ></span>
            </button>
          </form>

          <div class="text-center mt-3">
            <a routerLink="/register">Create an account</a>
          </div>

          <div class="alert alert-danger mt-3" *ngIf="error">{{ error }}</div>

          <hr class="my-4">

          <div class="text-center">
            <p class="text-muted small">Or sign in with</p>
            <div class="d-grid gap-2">
              <button class="btn btn-outline-secondary">
                <i class="bi bi-google"></i> Google
              </button>
              <button class="btn btn-outline-secondary">
                <i class="bi bi-facebook"></i> Facebook
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
